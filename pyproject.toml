[project]
name = "ero2"
version = "0.1.0"
description = "Simulation de files d'attente pour la moulinette EPITA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.1.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "scipy>=1.11.0",
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
]

[project.scripts]
sim = "ero2.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ero2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
